<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Search · Word Connect</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4eb;color:#203e33;font:16px "Trebuchet MS",sans-serif}main,header{width:min(100% - 32px,980px);margin:auto}header{padding:20px 0;border-bottom:1px solid #c3c8b9;font-weight:bold;display:flex;align-items:center;gap:10px}.mark{background:#244f3c;color:#fff5df;border-radius:6px;padding:7px}header i{margin-left:auto;font:italic 16px Georgia}h1{font:normal clamp(2.5rem,6vw,4.5rem)/1 Georgia;margin:12px 0}.intro{color:#4b5b4f}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}small{letter-spacing:.11em}select,button{font:inherit;color:inherit}select{border:1px solid #bdc6b9;border-radius:6px;background:#fffdf6;padding:6px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(205px,1fr);gap:22px;margin:20px 0}.paper,aside{padding:clamp(10px,2vw,24px);border-radius:14px;background:#fffdf6;border:1px solid #bec8b8}.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));position:relative;isolation:isolate}.board button{aspect-ratio:1;padding:0;background:transparent;border:0;font:600 clamp(14px,2.7vw,23px) ui-monospace,monospace;cursor:pointer;touch-action:manipulation}.board button:focus-visible,.board button.first{outline:2px solid #2c654d;outline-offset:-2px;border-radius:50%;background:#e3edda}.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}h2{font:normal 32px Georgia;margin:10px 0}.list{list-style:none;padding:0;margin:12px 0;display:grid;gap:3px}.list li{padding:7px 0;border-bottom:1px solid #e2e5d8;font-weight:bold;letter-spacing:.04em}.list li:before{content:'○';margin-right:10px;color:#657a68}.list .done{text-decoration:line-through;color:#566d59}.list .done:before{content:'✓'}.feedback{min-height:1.5em;margin:14px 0 0;color:#285840}#next{background:#234f3c;color:white;border:0;border-radius:20px;padding:9px 18px;cursor:pointer}@media(max-width:640px){.layout{grid-template-columns:1fr;gap:10px}.list{grid-template-columns:repeat(2,1fr);column-gap:10px}.top{margin-top:15px}.paper,aside{padding:10px}header{padding:12px 0}.intro{margin:8px 0}.layout{margin-top:12px}.board button{font-size:clamp(14px,4vw,21px)}}
</style></head><body><header><span class="mark">Wc</span> Word Connect <i>The Field Journal</i></header><main><div class="top"><small id="number"></small><select id="puzzle" aria-label="Choose puzzle"></select></div><h1>Word search</h1><p class="intro">Tap the first letter, then the last. Words run across, down or diagonally, in either direction.</p><div class="layout"><section class="paper" aria-label="Letter board"><div id="board" class="board"></div><p id="message" class="feedback" role="status"></p></section><aside><small id="progress"></small><h2>Find these words</h2><ul id="list" class="list"></ul><button id="next" hidden>Next puzzle</button></aside></div></main>
<script>
const puzzles=[{"title": "Vocabulary study", "words": ["ALACRITY", "AUTONOMY", "CENSURE", "COHERENT", "CONCUR", "CYNICAL", "ECLECTIC", "NUANCE"], "grid": ["AQJSLETCIDCI", "NUKIDAOYKJIA", "STTGCHCGDRTE", "OMXOECZIDNCC", "ADSRNXNYNNEE", "MOEVJOSQAYLN", "FNZUNHMUYRCS", "TSXDZGNYMGEU", "EEUALACRITYR", "PDRWOAOPTDQE", "RUCNOCPQPLNR", "FAHCAOMODVWU"]}, {"title": "Birdwatching", "words": ["FEATHER", "ROBIN", "HERON", "FINCH", "FALCON", "NESTLING", "WARBLER", "SPARROW"], "grid": ["ANNCDENOCLAF", "KPSONGGKUVKW", "KNCUQZPMCGOS", "HFEATHERBRGD", "CGGIWYJJRWIF", "RTNDAIWAHHSH", "EOBIAZPUFHTJ", "LIBELSWIUEKT", "BXOIETNUIRRN", "RFFMNCSWDOWE", "AYSNHLHEDNTB", "WQGNFFCDNZJA"]}, {"title": "In the lab", "words": ["ORBITAL", "IONIC", "SOLUTE", "SOLVENT", "KINETIC", "PLASMA", "ENERGY", "ATOM"], "grid": ["ZQFQQHZAALSN", "CEZCITENIKYH", "HWBNXYNTOBKY", "RPWORBITALDG", "AULAEXCDZAOR", "FMRXKMPSSEFE", "IVSBPHCOYGGN", "VOZAVYLLYSXE", "CDNRLVPURMGM", "KERIEPNTJLOO", "QMKNCPMEITAC", "FWTWPAPCARTX"]}, {"title": "Night sky", "words": ["ORION", "COMET", "NEBULA", "VENUS", "GALAXY", "ECLIPSE", "METEOR", "LUNAR"], "grid": ["XULZCHNIBKRT", "FRVXNWEBSAAS", "IORIONBJNNGF", "EDSCQXUUYSBW", "KSTKOILFMJYU", "QEPIIMAVWFNB", "KRRIBNEIQJVQ", "NMOVLFJTSELM", "SAEJSCTRNRQN", "YVTQNCEUCOLD", "NYEMBGSQHMAD", "OGMYXALAGFAR"]}];
const colors=['#b8dbc3','#ffd3a5','#c9d7ff','#efd0e0','#e6dda5','#b9e1e2','#e3c7ef','#cdddac'];
const byId=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem('word-search-v1'))||{}}catch{}
let current=Number.isInteger(saved.current)&&puzzles[saved.current]?saved.current:0;
let results=puzzles.map((_,i)=>Array.isArray(saved.results?.[i])?saved.results[i]:[]);
let first=null;
function persist(){try{localStorage.setItem('word-search-v1',JSON.stringify({current,results}))}catch{}}
function match(a,b){
 if(![a,b].every(i=>Number.isInteger(i)&&i>=0&&i<144)||a===b)return null;
 const dy=Math.floor(b/12)-Math.floor(a/12),dx=b%12-a%12;
 if(dx&&dy&&Math.abs(dx)!==Math.abs(dy))return null;
 let text='';const grid=puzzles[current].grid;
 for(let i=0;i<=Math.max(Math.abs(dx),Math.abs(dy));i++)text+=grid[Math.floor(a/12)+i*Math.sign(dy)][a%12+i*Math.sign(dx)];
 return puzzles[current].words.find(w=>w===text||w===[...text].reverse().join(''))||null;
}
function renderResults(){
 const words=puzzles[current].words,found=new Set(),lines=byId('marks');lines.replaceChildren();
 for(const pair of results[current]){
  if(!Array.isArray(pair))continue;const [a,b]=pair,word=match(a,b);if(!word||found.has(word))continue;found.add(word);
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  for(const [key,value] of Object.entries({x1:a%12+.5,y1:Math.floor(a/12)+.5,x2:b%12+.5,y2:Math.floor(b/12)+.5,stroke:colors[words.indexOf(word)],'stroke-width':.68,'stroke-linecap':'round'}))line.setAttribute(key,value);
  lines.append(line);
 }
 byId('list').replaceChildren(...words.map(w=>{const li=document.createElement('li');li.textContent=w;if(found.has(w)){li.className='done';li.ariaLabel=w+' found'}return li}));
 byId('progress').textContent=found.size+' / '+words.length+' FOUND';byId('next').hidden=found.size!==words.length;
 return found.size===words.length;
}
function pick(i){
 const buttons=byId('board').querySelectorAll('button'),message=byId('message');
 if(first===null){first=i;buttons[i].classList.add('first');message.textContent='Now tap the other end.';return}
 const a=first;buttons[a].classList.remove('first');first=null;
 if(a===i){message.textContent='Selection cleared.';return}
 const word=match(a,i);
 if(!word){message.textContent='No listed word there. Try another pair.';return}
 if(results[current].some(pair=>Array.isArray(pair)&&match(...pair)===word)){message.textContent=word+' is already marked.';return}
 results[current].push([a,i]);persist();message.textContent=renderResults()?'All words found!':word+' found!';
}
function openPuzzle(i){
 current=i;first=null;byId('puzzle').value=i;byId('number').textContent='PUZZLE '+(i+1)+' / '+puzzles.length;
 const board=byId('board');board.innerHTML='<svg id="marks" viewBox="0 0 12 12" preserveAspectRatio="none" aria-hidden="true"></svg>';
 [...puzzles[i].grid.join('')].forEach((letter,k)=>{const button=document.createElement('button');button.textContent=letter;button.ariaLabel=letter+', row '+(Math.floor(k/12)+1)+', column '+(k%12+1);button.onclick=()=>pick(k);board.append(button)});
 byId('message').textContent=renderResults()?'All words found!':'Choose a word from the list and find its first letter.';persist();
}
puzzles.forEach((p,i)=>byId('puzzle').add(new Option(p.title,i)));
byId('puzzle').onchange=e=>openPuzzle(Number(e.target.value));
byId('next').onclick=()=>openPuzzle((current+1)%puzzles.length);
openPuzzle(current);
</script></body></html>
